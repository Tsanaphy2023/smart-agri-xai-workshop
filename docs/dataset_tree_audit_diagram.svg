      <circle cx="28" cy="25" r="10" fill="#f59e0b"/>
      <text x="28" y="29" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
      <text x="50" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">Durian_Insects (แมลงศัตรูพืชทุเรียน)</text>
      <rect x="425" y="16" width="70" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
