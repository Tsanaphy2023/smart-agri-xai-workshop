      <circle cx="28" cy="25" r="10" fill="#8b5cf6"/>
      <text x="28" y="29" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
      <text x="50" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Plant_Nutrient (การขาดธาตุอาหารหลัก N-P-K)</text>
      <text x="50" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8">➔ ดึงจาก PlantNutrient/Maize_ข้าวโพด (อาการขาดไนโตรเจน, ฟอสฟอรัส, โพแทสเซียม)</text>
