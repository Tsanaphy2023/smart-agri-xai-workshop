      <text x="15" y="47" font-family="sans-serif" font-size="11" fill="#94a3b8">├─ Durian_ทุเรียน: 220 ไฟล์ (เพลี้ยไก่แจ้, หนอนเจาะต้น, ไรแดง, ใบปกติ)</text>
      <text x="15" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">├─ General_Crops_พืชทั่วไป: 300 ไฟล์ (หนอนกระทู้, เพลี้ยอ่อน, แมลงหวี่ขาว)</text>
      <text x="15" y="83" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">└─ Rice_ข้าว: 241 ไฟล์ (เพลี้ยกระโดดสีน้ำตาล, หนอนกอ, หนอนห่อใบ)</text>
