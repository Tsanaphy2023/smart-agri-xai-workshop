      <circle cx="28" cy="25" r="10" fill="#f59e0b"/>
      <text x="28" y="29" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
      <text x="50" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">General_Crop_Insects (แมลงศัตรูพืชทั่วไป)</text>
      <rect x="425" y="16" width="70" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="460" y="30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">NEW IN COLAB</text>
      <text x="50" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">➔ ดึงจาก PlantInsect/General_Crops_พืชทั่วไป (เพลี้ยอ่อน, หนอนกระทู้, แมลงหวี่ขาว)</text>
