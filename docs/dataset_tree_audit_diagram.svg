      <text x="15" y="47" font-family="sans-serif" font-size="11" fill="#94a3b8">├─ SoilType/01_Real_Data: 156 ภาพจริง (5 ชนิดดิน: ดำ, ลูกรัง, เหนียว, พรุ, เหลือง)</text>
      <text x="15" y="68" font-family="sans-serif" font-size="11" fill="#94a3b8">└─ SoilNutrient: thai_soil_crop_recommendation.csv + Crop_recommendation.csv</text>
