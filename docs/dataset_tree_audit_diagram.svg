      <text x="15" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">├─ Maize_ข้าวโพด: 360 ไฟล์ | Tomato_มะเขือเทศ: 360 ไฟล์</text>
      <text x="15" y="83" font-family="sans-serif" font-size="11" fill="#94a3b8">└─ Rice_ข้าว: 186 ไฟล์ | Cassava_มันสำปะหลัง: 61 ไฟล์</text>
