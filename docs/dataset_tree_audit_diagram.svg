      <text x="50" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8">➔ ดึงจาก PlantDiseases/Durian_ทุเรียน (แอนแทรคโนส, รากเน่าโคนเน่า, จุดสนิมสาหร่าย)</text>
