      <text x="50" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">➔ ดึงจาก PlantInsect/Durian_ทุเรียน (เพลี้ยไก่แจ้, หนอนเจาะต้น, ไรแดง, ใบสมบูรณ์)</text>
    </g>

    <!-- Option 4 -->
    <g transform="translate(20, 320)">
