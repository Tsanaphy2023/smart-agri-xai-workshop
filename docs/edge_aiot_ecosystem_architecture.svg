            <text x="0" y="42" fill="#cbd5e1" font-size="12" font-family="'Prompt', sans-serif"><b>คณะผู้วิจัยและวิทยากร:</b> ผศ.ดร.ชีวะ ทัศนา, ผศ.อรรถกร คำฉัตร, ผศ.ดร.จิรภัทร จันทมาลี, ผศ.ดร.ณมนรัก คำฉัตร, รศ.ดร.นิภัทร เปี่ยมอรุณ, รศ.ดร.นันทพร มูลรังษี</text>
            <text x="0" y="64" fill="#94a3b8" font-size="11" font-family="'Prompt', sans-serif"><b>หน่วยงานสนับสนุน:</b> หน่วยวิเคราะห์คุณภาพสิ่งแวดล้อมสำหรับพื้นที่ (LEQS) และหน่วยวิจัยปัญญาประดิษฐ์ฝังตัวและเอดจ์เอไอโอที มหาวิทยาลัยราชภัฏรำไพพรรณี</text>
