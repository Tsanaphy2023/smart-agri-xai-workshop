        <text x="0" y="82" fill="#94a3b8" font-size="13" font-family="'Prompt', sans-serif">การบูรณาการระบบเซนเซอร์เคมีดิน การสแกนภาพความละเอียดสูง และการประมวลผลออฟไลน์บนขอบเครือข่าย</text>
