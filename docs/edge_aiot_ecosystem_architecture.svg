        </g>

        <rect x="18" y="305" width="214" height="42" rx="8" fill="#0f172a" stroke="#f59e0b"/>
        <text x="125" y="325" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">RBRU PRECISION AGRI</text>
        <text x="125" y="339" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'Prompt', sans-serif">ผศ.ดร.ชีวะ ทัศนา และคณะ</text>
