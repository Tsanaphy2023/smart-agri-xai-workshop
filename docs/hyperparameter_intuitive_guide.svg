<svg viewBox="0 0 1200 660" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="paramBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>

        <linearGradient id="pGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="pGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="pGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="pGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#be185d" stop-opacity="0.05"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="1200" height="660" rx="18" fill="url(#paramBg)" stroke="#1e293b" stroke-width="2"/>

    <!-- Header Section -->
    <g transform="translate(40, 36)">
        <rect x="0" y="0" width="220" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
        <text x="110" y="18" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">INTUITIVE PARAMETER GUIDE</text>
        
        <text x="0" y="58" fill="#f8fafc" font-size="22" font-weight="800" font-family="'Prompt', sans-serif">💡 แผนผังถอดรหัสพารามิเตอร์โค้ด AI ฉบับเปรียบเทียบในชีวิตประจำวัน</text>
        <text x="0" y="82" fill="#94a3b8" font-size="13" font-family="'Prompt', sans-serif">เข้าใจผลกระทบของตัวแปรในโค้ด Python เพื่อปรับแต่งโมเดลให้แม่นยำสูงสุดโดยไม่ต้องเดาสุ่ม</text>
    </g>

    <!-- 4 Cards Grid -->

    <!-- Card 1: Epochs -->
    <g transform="translate(40, 130)">
        <rect width="265" height="360" rx="14" fill="url(#pGrad1)" stroke="#3b82f6" stroke-width="1.5"/>
        <rect x="18" y="18" width="44" height="44" rx="10" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="40" y="47" font-size="22" text-anchor="middle">📚</text>
        
        <text x="74" y="36" fill="#93c5fd" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">Epochs</text>
        <text x="74" y="54" fill="#cbd5e1" font-size="12" font-family="'Prompt', sans-serif">รอบการอ่านหนังสือสอบ</text>

        <!-- Analogy Box -->
        <rect x="18" y="78" width="229" height="110" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="30" y="100" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Prompt', sans-serif">เปรียบเทียบผลลัพธ์เชิงพฤติกรรม:</text>
        <text x="30" y="122" fill="#f87171" font-size="10" font-family="'Prompt', sans-serif">• <b>1-2 รอบ:</b> อ่านไม่ทันสอบ ตก (Underfit)</text>
        <text x="30" y="142" fill="#34d399" font-size="10" font-family="'Prompt', sans-serif">• <b>5-10 รอบ:</b> จำสาระแม่นยำ (Optimal ★)</text>
        <text x="30" y="162" fill="#f87171" font-size="10" font-family="'Prompt', sans-serif">• <b>50+ รอบ:</b> ท่องจำจนตอบพลิกแพลงไม่ได้</text>

        <!-- Impact Description -->
        <g transform="translate(18, 204)">
            <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">[OPERATIONAL MEANING]</text>
            <text x="0" y="34" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">จำนวนครั้งที่ AI นำภาพทั้งหมด</text>
            <text x="0" y="52" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">มาวนคำนวณปรับแต่งค่าน้ำหนักซ้ำ</text>
            <text x="0" y="70" fill="#94a3b8" font-size="10" font-family="'Prompt', sans-serif">ยิ่งรอบเยอะ ยิ่งใช้เวลาประมวลผลนาน</text>
        </g>

        <!-- Recommended Value Badge -->
        <rect x="18" y="300" width="229" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="132" y="318" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">ค่าที่เหมาะสมที่สุดในเวิร์กช็อป</text>
        <text x="132" y="334" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">epochs = 5 ถึง 10</text>
    </g>

    <!-- Card 2: Batch Size -->
    <g transform="translate(325, 130)">
        <rect width="265" height="360" rx="14" fill="url(#pGrad2)" stroke="#10b981" stroke-width="1.5"/>
        <rect x="18" y="18" width="44" height="44" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
        <text x="40" y="47" font-size="22" text-anchor="middle">🗂️</text>
        
        <text x="74" y="36" fill="#6ee7b7" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">Batch Size</text>
        <text x="74" y="54" fill="#cbd5e1" font-size="12" font-family="'Prompt', sans-serif">การ์ดคำศัพท์ต่อหนึ่งชุด</text>

        <!-- Analogy Box -->
        <rect x="18" y="78" width="229" height="110" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="30" y="100" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Prompt', sans-serif">เปรียบเทียบผลลัพธ์เชิงพฤติกรรม:</text>
        <text x="30" y="122" fill="#fbbf24" font-size="10" font-family="'Prompt', sans-serif">• <b>4 ภาพ:</b> ตรวจทีละนิด ช้า เดินสะเปะสะปะ</text>
        <text x="30" y="142" fill="#34d399" font-size="10" font-family="'Prompt', sans-serif">• <b>16-32 ภาพ:</b> เสถียร แรมพอดี (Optimal ★)</text>
        <text x="30" y="162" fill="#f87171" font-size="10" font-family="'Prompt', sans-serif">• <b>128+ ภาพ:</b> แรม GPU ล้น (OOM Crash)</text>

        <!-- Impact Description -->
        <g transform="translate(18, 204)">
            <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">[OPERATIONAL MEANING]</text>
            <text x="0" y="34" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">จำนวนภาพที่ส่งเข้าไปคำนวณพร้อมกัน</text>
            <text x="0" y="52" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">ในหน่วยประมวลผล GPU ต่อ 1 รอบย่อย</text>
            <text x="0" y="70" fill="#94a3b8" font-size="10" font-family="'Prompt', sans-serif">ช่วยประหยัดเวลาและเกลี่ยทิศทางเวกเตอร์</text>
        </g>

        <!-- Recommended Value Badge -->
        <rect x="18" y="300" width="229" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <text x="132" y="318" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">ค่าที่เหมาะสมที่สุดในเวิร์กช็อป</text>
        <text x="132" y="334" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">batch_size = 16 หรือ 32</text>
    </g>

    <!-- Card 3: Learning Rate -->
    <g transform="translate(610, 130)">
        <rect width="265" height="360" rx="14" fill="url(#pGrad3)" stroke="#f59e0b" stroke-width="1.5"/>
        <rect x="18" y="18" width="44" height="44" rx="10" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="40" y="47" font-size="22" text-anchor="middle">👟</text>
        
        <text x="74" y="36" fill="#fde68a" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">Learning Rate</text>
        <text x="74" y="54" fill="#cbd5e1" font-size="12" font-family="'Prompt', sans-serif">ก้าวย่างความเร็วในการเดิน</text>

        <!-- Analogy Box -->
        <rect x="18" y="78" width="229" height="110" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="30" y="100" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Prompt', sans-serif">เปรียบเทียบผลลัพธ์เชิงพฤติกรรม:</text>
        <text x="30" y="122" fill="#f87171" font-size="10" font-family="'Prompt', sans-serif">• <b>0.1 (กว้าง):</b> ก้าวข้ามหุบ หลุดโค้ง (Diverge)</text>
        <text x="30" y="142" fill="#34d399" font-size="10" font-family="'Prompt', sans-serif">• <b>0.001 (พอดี):</b> นุ่มนวล แม่นยำ (Optimal ★)</text>
        <text x="30" y="162" fill="#fbbf24" font-size="10" font-family="'Prompt', sans-serif">• <b>0.000001 (แคบ):</b> คืบคลานช้าจนหมดเวลา</text>

        <!-- Impact Description -->
        <g transform="translate(18, 204)">
            <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">[OPERATIONAL MEANING]</text>
            <text x="0" y="34" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">อัตราการปรับเปลี่ยนน้ำหนัก (Weights)</text>
            <text x="0" y="52" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">ตามทิศทาง Gradient ของข้อผิดพลาด</text>
            <text x="0" y="70" fill="#94a3b8" font-size="10" font-family="'Prompt', sans-serif">ควบคุมโดย Adam Optimizer อัตโนมัติ</text>
        </g>

        <!-- Recommended Value Badge -->
        <rect x="18" y="300" width="229" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="132" y="318" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">ค่าที่เหมาะสมที่สุดในเวิร์กช็อป</text>
        <text x="132" y="334" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">learning_rate = 0.001</text>
    </g>

    <!-- Card 4: Target ROI Crop -->
    <g transform="translate(895, 130)">
        <rect width="265" height="360" rx="14" fill="url(#pGrad4)" stroke="#ec4899" stroke-width="1.5"/>
        <rect x="18" y="18" width="44" height="44" rx="10" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.2"/>
        <text x="40" y="47" font-size="22" text-anchor="middle">🔍</text>
        
        <text x="74" y="36" fill="#fbcfe8" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">Target ROI</text>
        <text x="74" y="54" fill="#cbd5e1" font-size="12" font-family="'Prompt', sans-serif">แว่นขยายส่องเฉพาะผิวเป้าหมาย</text>

        <!-- Analogy Box -->
        <rect x="18" y="78" width="229" height="110" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="30" y="100" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Prompt', sans-serif">เปรียบเทียบผลลัพธ์เชิงพฤติกรรม:</text>
        <text x="30" y="122" fill="#f87171" font-size="10" font-family="'Prompt', sans-serif">• <b>ทั้งภาพ:</b> AI แอบจำรองเท้า/ขอบโต๊ะ</text>
        <text x="30" y="142" fill="#34d399" font-size="10" font-family="'Prompt', sans-serif">• <b>กรอบ 150 px:</b> เจาะจงดิน/ใบพืช (Optimal ★)</text>
        <text x="30" y="162" fill="#fbbf24" font-size="10" font-family="'Prompt', sans-serif">• <b>เล็กเกินไป (&lt;30 px):</b> สูญเสียเท็กซ์เจอร์</text>

        <!-- Impact Description -->
        <g transform="translate(18, 204)">
            <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">[OPERATIONAL MEANING]</text>
            <text x="0" y="34" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">การตัดกรอบพิกัดเฉพาะกึ่งกลางภาพถ่าย</text>
            <text x="0" y="52" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">เพื่อคัดเฉพาะเนื้อดินหรือแผ่นใบพืชแท้จริง</text>
            <text x="0" y="70" fill="#94a3b8" font-size="10" font-family="'Prompt', sans-serif">ขจัดข้อผิดพลาด Clever Hans ลวงตาโมเดล</text>
        </g>

        <!-- Recommended Value Badge -->
        <rect x="18" y="300" width="229" height="42" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
        <text x="132" y="318" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">ค่าที่เหมาะสมที่สุดในเวิร์กช็อป</text>
        <text x="132" y="334" fill="#f472b6" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">Crop: (150, 150) px</text>
    </g>

    <!-- Bottom Guidance Banner -->
    <g transform="translate(40, 515)">
        <rect width="1120" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <g transform="translate(25, 22)">
            <text x="0" y="18" fill="#10b981" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">🎯 กฎทอง 3 ข้อในการปรับแต่งพารามิเตอร์สำหรับผู้เริ่มต้น (The Golden Rules of Low-Code AI):</text>
            <text x="0" y="44" fill="#cbd5e1" font-size="12" font-family="'Prompt', sans-serif"><b>1. เริ่มจากค่ามาตรฐานเสมอ:</b> ใช้ Epochs = 5 และ Batch = 16 ก่อนเพื่อดูแนวโน้มว่ากราฟ Loss ลดลงอย่างราบรื่นหรือไม่</text>
            <text x="0" y="66" fill="#cbd5e1" font-size="12" font-family="'Prompt', sans-serif"><b>2. สังเกตช่องว่างระหว่าง Train vs Val:</b> หาก Train Acc สูงมาก แต่ Val Acc ต่ำ แสดงว่าเริ่มเกิด Overfitting ให้หยุดรอบหรือเพิ่มภาพ</text>
            <text x="0" y="88" fill="#cbd5e1" font-size="12" font-family="'Prompt', sans-serif"><b>3. คุณภาพภาพถ่ายสำคัญกว่าความซับซ้อน:</b> การครอบตัดกรอบเป้าหมาย ROI ที่สะอาด ให้ผลลัพธ์แม่นยำกว่าการเพิ่มรอบเทรนโมเดล</text>
        </g>
    </g>
</svg>
