<svg viewBox="0 0 1200 680" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients -->
        <linearGradient id="roiBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>

        <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#e11d48" stop-opacity="0.04"/>
        </linearGradient>
        <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0891b2" stop-opacity="0.04"/>
        </linearGradient>
        <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.04"/>
        </linearGradient>
        <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#d97706" stop-opacity="0.04"/>
        </linearGradient>
        <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#059669" stop-opacity="0.04"/>
        </linearGradient>
        <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#2563eb" stop-opacity="0.04"/>
        </linearGradient>

        <!-- Arrow Markers -->
        <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
        </marker>
        <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>

        <!-- Glow Filters -->
        <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="1200" height="680" rx="18" fill="url(#roiBg)" stroke="#1e293b" stroke-width="2"/>

    <!-- Header Section -->
    <g transform="translate(40, 36)">
        <rect x="0" y="0" width="168" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="84" y="18" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">COMPUTER VISION PIPELINE</text>
        
        <text x="0" y="58" fill="#f8fafc" font-size="22" font-weight="800" font-family="'Prompt', sans-serif">🔬 แผนผังการสกัดพื้นที่ภาพถ่ายดิน (Two-Stage Adaptive ROI &amp; CIE L*a*b*)</text>
        <text x="0" y="82" fill="#94a3b8" font-size="13" font-family="'Prompt', sans-serif">อัลกอริทึม 6 ขั้นตอน ขจัดสิ่งรบกวนฉากหลัง (รองเท้า พื้นโต๊ะ มือจับ) ป้องกันโมเดล AI จำผิดส่วน (Clever Hans Effect)</text>
    </g>

    <!-- Pipeline Flow Containers (6 Steps) -->

    <!-- STEP 1 -->
    <g transform="translate(40, 140)">
        <rect width="170" height="340" rx="14" fill="url(#cardGrad1)" stroke="#f43f5e" stroke-width="1.4"/>
        <circle cx="85" cy="40" r="22" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="85" y="46" fill="#f43f5e" font-size="15" font-weight="800" text-anchor="middle" font-family="'Prompt', sans-serif">①</text>
        
        <text x="85" y="85" fill="#fda4af" font-size="13" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">ภาพถ่ายภาคสนาม</text>
        <text x="85" y="104" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">Raw Ingestion</text>

        <!-- Inner visual diagram -->
        <rect x="25" y="125" width="120" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
        <circle cx="85" cy="170" r="28" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <line x1="85" y1="135" x2="85" y2="205" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="50" y1="170" x2="120" y2="170" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>
        <circle cx="85" cy="170" r="3" fill="#f43f5e"/>

        <text x="85" y="240" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">จุดเล็งกึ่งกลางเลนส์</text>
        <text x="85" y="260" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">ตรวจจับพิกัดกึ่งกลาง</text>
        <text x="85" y="278" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">(Center Reticle)</text>

        <rect x="15" y="295" width="140" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="85" y="315" fill="#fda4af" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">Target: Soil / Leaf</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 215 310 L 230 310" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)"/>

    <!-- STEP 2 -->
    <g transform="translate(235, 140)">
        <rect width="170" height="340" rx="14" fill="url(#cardGrad2)" stroke="#06b6d4" stroke-width="1.4"/>
        <circle cx="85" cy="40" r="22" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="85" y="46" fill="#06b6d4" font-size="15" font-weight="800" text-anchor="middle" font-family="'Prompt', sans-serif">②</text>
        
        <text x="85" y="85" fill="#67e8f9" font-size="13" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">ความเด่นชัดทางสี</text>
        <text x="85" y="104" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">Salience Mapping</text>

        <!-- Inner visual diagram -->
        <rect x="25" y="125" width="120" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
        <rect x="35" y="135" width="100" height="70" rx="4" fill="#0891b2" fill-opacity="0.3"/>
        <circle cx="85" cy="170" r="24" fill="#22d3ee" fill-opacity="0.6"/>
        <circle cx="85" cy="170" r="14" fill="#67e8f9" fill-opacity="0.9"/>

        <text x="85" y="240" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">ดัชนีแสงและพิกัดสี</text>
        <text x="85" y="260" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">ExG = 2G - R - B (พืช)</text>
        <text x="85" y="278" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">Delta Lab Dist (ดิน)</text>

        <rect x="15" y="295" width="140" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="85" y="315" fill="#67e8f9" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">Saliency Map: 0-255</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 410 310 L 425 310" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)"/>

    <!-- STEP 3 -->
    <g transform="translate(430, 140)">
        <rect width="170" height="340" rx="14" fill="url(#cardGrad3)" stroke="#8b5cf6" stroke-width="1.4"/>
        <circle cx="85" cy="40" r="22" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="85" y="46" fill="#8b5cf6" font-size="15" font-weight="800" text-anchor="middle" font-family="'Prompt', sans-serif">③</text>
        
        <text x="85" y="85" fill="#c4b5fd" font-size="13" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">ถ่วงน้ำหนักกึ่งกลาง</text>
        <text x="85" y="104" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">2D Gaussian Prior</text>

        <!-- Inner visual diagram -->
        <rect x="25" y="125" width="120" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
        <ellipse cx="85" cy="170" rx="50" ry="36" fill="#7c3aed" fill-opacity="0.15"/>
        <ellipse cx="85" cy="170" rx="36" ry="26" fill="#8b5cf6" fill-opacity="0.35"/>
        <ellipse cx="85" cy="170" rx="20" ry="14" fill="#c4b5fd" fill-opacity="0.75"/>

        <text x="85" y="240" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">ขจัดขอบภาพและมุม</text>
        <text x="85" y="260" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">คัดเฉพาะวัตถุเป้าหมาย</text>
        <text x="85" y="278" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">กดค่าน้ำหนักขอบเป็น 0</text>

        <rect x="15" y="295" width="140" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="85" y="315" fill="#c4b5fd" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">G(x,y) * Salience</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 605 310 L 620 310" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)"/>

    <!-- STEP 4 -->
    <g transform="translate(625, 140)">
        <rect width="170" height="340" rx="14" fill="url(#cardGrad4)" stroke="#f59e0b" stroke-width="1.4"/>
        <circle cx="85" cy="40" r="22" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="85" y="46" fill="#f59e0b" font-size="15" font-weight="800" text-anchor="middle" font-family="'Prompt', sans-serif">④</text>
        
        <text x="85" y="85" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">สัณฐานวิทยาหน้ากาก</text>
        <text x="85" y="104" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">Morphological Close</text>

        <!-- Inner visual diagram -->
        <rect x="25" y="125" width="120" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
        <!-- Binary Mask with smooth fill -->
        <path d="M 45 180 Q 55 140 85 145 Q 120 150 125 180 Q 115 205 85 200 Q 55 205 45 180 Z" fill="#f59e0b" fill-opacity="0.7" stroke="#fbbf24" stroke-width="1.5"/>

        <text x="85" y="240" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">อุดรูพรุนและรอยแตก</text>
        <text x="85" y="260" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">เชื่อมเม็ดดินเป็นเนื้อเดียว</text>
        <text x="85" y="278" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">Kernel 7x7 Ellipse</text>

        <rect x="15" y="295" width="140" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="85" y="315" fill="#fde68a" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">Clean Binary Mask</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 800 310 L 815 310" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)"/>

    <!-- STEP 5 -->
    <g transform="translate(820, 140)">
        <rect width="170" height="340" rx="14" fill="url(#cardGrad5)" stroke="#10b981" stroke-width="1.4"/>
        <circle cx="85" cy="40" r="22" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
        <text x="85" y="46" fill="#10b981" font-size="15" font-weight="800" text-anchor="middle" font-family="'Prompt', sans-serif">⑤</text>
        
        <text x="85" y="85" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">คัดกรองรูปทรง</text>
        <text x="85" y="104" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">Contour &amp; Convexity</text>

        <!-- Inner visual diagram -->
        <rect x="25" y="125" width="120" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
        <polygon points="50,180 65,145 105,145 120,180 100,205 65,205" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="2"/>
        <polygon points="50,180 65,145 105,145 120,180 100,205 65,205" fill="none" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="2,2"/>

        <text x="85" y="240" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">เกณฑ์ความแน่นตัน</text>
        <text x="85" y="260" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">Solidity = Area/Hull</text>
        <text x="85" y="278" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">เกณฑ์ผ่าน &gt; 0.70</text>

        <rect x="15" y="295" width="140" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="85" y="315" fill="#6ee7b7" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">Passed Geometry</text>
    </g>

    <!-- Arrow 5 -> 6 -->
    <path d="M 995 310 L 1010 310" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)"/>

    <!-- STEP 6 -->
    <g transform="translate(1015, 140)">
        <rect width="150" height="340" rx="14" fill="url(#cardGrad6)" stroke="#3b82f6" stroke-width="1.8" filter="url(#glowGreen)"/>
        <circle cx="75" cy="40" r="22" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="75" y="46" fill="#60a5fa" font-size="15" font-weight="800" text-anchor="middle" font-family="'Prompt', sans-serif">⑥</text>
        
        <text x="75" y="85" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">ตัดกรอบ &amp; ปรับแสง</text>
        <text x="75" y="104" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">Target ROI Crop</text>

        <!-- Inner visual diagram -->
        <rect x="20" y="125" width="110" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
        <rect x="30" y="135" width="90" height="70" rx="4" fill="#2563eb" fill-opacity="0.4" stroke="#60a5fa" stroke-width="2"/>
        <text x="75" y="174" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">150x150</text>

        <text x="75" y="240" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">CIE L*a*b* CLAHE</text>
        <text x="75" y="260" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">ขจัดเงาแดด/แสงแฟลช</text>
        <text x="75" y="278" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">ส่งเข้าโมเดล AI 100%</text>

        <rect x="10" y="295" width="130" height="30" rx="6" fill="#0f172a" stroke="#10b981"/>
        <text x="75" y="315" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">AI-READY CROP</text>
    </g>

    <!-- Bottom Physical Telemetry Dashboard -->
    <g transform="translate(40, 510)">
        <rect width="1125" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        
        <!-- Header -->
        <text x="25" y="32" fill="#38bdf8" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">[PHYSICAL QUALITY GATES &amp; CHEMICAL DESCRIPTORS]</text>
        <text x="25" y="52" fill="#94a3b8" font-size="11" font-family="'Prompt', sans-serif">ระบบตรวจสอบความสมบูรณ์เชิงฟิสิกส์ก่อนส่งให้โมเดล AI ประมวลผล เพื่อความแม่นยำสูงสุดในระดับห้องปฏิบัติการ</text>

        <!-- 4 Telemetry Metrics Cards -->
        <g transform="translate(25, 68)">
            <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
            <text x="15" y="22" fill="#94a3b8" font-size="10" font-family="'Prompt', sans-serif">ความคมชัด (Laplacian Variance)</text>
            <text x="15" y="42" fill="#34d399" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">&gt; 100.0 (คมชัดสูง ไร้เบลอ)</text>
        </g>

        <g transform="translate(300, 68)">
            <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
            <text x="15" y="22" fill="#94a3b8" font-size="10" font-family="'Prompt', sans-serif">แสงสะท้อนจ้า (Glare Area Ratio)</text>
            <text x="15" y="42" fill="#38bdf8" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">&lt; 8.0% (แสงสมดุลเป็นธรรมชาติ)</text>
        </g>

        <g transform="translate(575, 68)">
            <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
            <text x="15" y="22" fill="#94a3b8" font-size="10" font-family="'Prompt', sans-serif">ดัชนีความชื้นคาดคะเน (Moisture Proxy)</text>
            <text x="15" y="42" fill="#fbbf24" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">100 - L* (ผกผันกับความสว่าง)</text>
        </g>

        <g transform="translate(850, 68)">
            <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
            <text x="15" y="22" fill="#94a3b8" font-size="10" font-family="'Prompt', sans-serif">ดัชนีสีแดงดินลูกรัง (Redness Index)</text>
            <text x="15" y="42" fill="#f87171" font-size="15" font-weight="700" font-family="'JetBrains Mono', monospace">R² / (B × G) (ธาตุเหล็ก/Laterite)</text>
        </g>
    </g>
</svg>
