<svg viewBox="0 0 1100 520" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#0e7490" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1"/>
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>
        <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
        </marker>
        <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
        </marker>
    </defs>

    <rect width="1100" height="520" rx="16" fill="#0b1120"/>

    <!-- Column 1: Inputs -->
    <rect x="30" y="40" width="220" height="440" rx="16" fill="url(#gradGreen)" stroke="#10b981" stroke-width="1.5"/>
    <text x="140" y="75" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">1. แหล่งข้อมูลนำเข้า (Inputs)</text>
    
    <rect x="50" y="105" width="180" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="140" y="135" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">📸 ภาพถ่ายหน้าดิน &amp; ใบพืช</text>
    <text x="140" y="160" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">ดิน 5 ชนิด / ใบขาด NPK / โรคทุเรียน</text>

    <rect x="50" y="215" width="180" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="140" y="245" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">🧪 ค่าเคมีเซนเซอร์ดิน</text>
    <text x="140" y="270" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">N, P, K, pH, อุณหภูมิ, ความชื้น (RS485)</text>

    <rect x="50" y="325" width="180" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="140" y="355" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">🌈 OSSL VisNIR / MIR</text>
    <text x="140" y="380" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">สเปกโตรสโกปีดิน 2,152 ช่วงคลื่น</text>

    <!-- Arrows Col 1 -> Col 2 -->
    <path d="M 250 145 L 310 145" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 250 255 L 310 255" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 250 365 L 310 365" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Column 2: AI Engines -->
    <rect x="310" y="40" width="230" height="440" rx="16" fill="url(#gradBlue)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="425" y="75" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">2. เครื่องยนต์ AI (Engines)</text>

    <rect x="330" y="105" width="190" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="425" y="135" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">MobileNetV3 / YOLOv11</text>
    <text x="425" y="160" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">PyTorch Transfer Learning</text>

    <rect x="330" y="215" width="190" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="425" y="245" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">Crop Recommender ML</text>
    <text x="425" y="270" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">Nearest Centroid (2,200 แปลง)</text>

    <rect x="330" y="325" width="190" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="425" y="355" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">Hybrid LLM (Gemini / Ollama)</text>
    <text x="425" y="380" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">Multimodal Cloud / LLaVA Local</text>

    <!-- Arrows Col 2 -> Col 3 -->
    <path d="M 540 260 L 600 260" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Column 3: Format & Export -->
    <rect x="600" y="40" width="210" height="440" rx="16" fill="url(#gradAmber)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="705" y="75" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">3. รูปแบบและการส่งออก</text>

    <rect x="620" y="125" width="170" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="705" y="155" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">⚡ ONNX / TFLite</text>
    <text x="705" y="180" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">โมเดลมาตรฐานเปิด &lt; 10 MB</text>
    <text x="705" y="202" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="monospace">INT8 Quantized</text>

    <rect x="620" y="265" width="170" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="705" y="295" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">📊 Standard JSON</text>
    <text x="705" y="320" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Prompt', sans-serif">Schema สรุปผล 4 มิติ</text>
    <text x="705" y="342" fill="#34d399" font-size="10" text-anchor="middle" font-family="monospace">diagnosis + fertilizer</text>

    <!-- Arrows Col 3 -> Col 4 -->
    <path d="M 810 260 L 870 260" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- Column 4: Deployment -->
    <rect x="870" y="40" width="200" height="440" rx="16" fill="url(#gradPurple)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="970" y="75" fill="#a78bfa" font-size="16" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">4. การนำไปใช้งาน</text>

    <rect x="885" y="100" width="170" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="970" y="128" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">💻 Streamlit Web Portal</text>
    <text x="970" y="152" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">Dual-Tab Diagnostic Dashboard</text>

    <rect x="885" y="190" width="170" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="970" y="218" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">🌐 REST API Microservice</text>
    <text x="970" y="242" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">server.py พอร์ต 8000 / LineBot</text>

    <rect x="885" y="280" width="170" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="970" y="308" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">📱 Flutter Mobile App</text>
    <text x="970" y="332" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">On-Device Edge ออฟไลน์ 100%</text>

    <rect x="885" y="370" width="170" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="970" y="398" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" font-family="'Prompt', sans-serif">📟 Smart AIoT Field Kit</text>
    <text x="970" y="422" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'Prompt', sans-serif">Raspberry Pi + RS485 Probe</text>
</svg>
