<svg viewBox="0 0 1000 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>

        <linearGradient id="cGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="cGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="cGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05"/>
        </linearGradient>

        <marker id="arrow1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>
        <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
        </marker>
    </defs>

    <!-- Canvas Background -->
    <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

    <!-- Header / Banner -->
    <g transform="translate(35, 24)">
        <rect x="0" y="0" width="130" height="22" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
        <text x="65" y="15" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">STEP 1 PIPELINE</text>
        <text x="145" y="16" fill="#f8fafc" font-size="16" font-weight="800" font-family="'Prompt', sans-serif">🚀 ขั้นตอนที่ 1: การเชื่อมต่อคลาวด์ ตรวจสอบการ์ดจอ GPU และซิงก์คลังโค้ดล่าสุด</text>
    </g>

    <!-- Card 1: Google Colab Runtime -->
    <g transform="translate(35, 65)">
        <rect width="280" height="225" rx="12" fill="url(#cGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">☁️</text>
        
        <text x="66" y="32" fill="#fde68a" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">1. รันไทม์ Google Colab</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Cloud Handshake</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• เปิดใช้งานผ่านเว็บเบราว์เซอร์</text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• จัดสรร Virtual Machine ส่วนตัว</text>
        <text x="28" y="132" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ผู้เข้าอบรมแยกเครื่องอิสระ 100%</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Linux Ubuntu 22.04 LTS Runtime</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="140" y="193" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">สถานะ: เชื่อมต่อเซิร์ฟเวอร์เสร็จสิ้น</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 325 178 L 350 178" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow1)"/>

    <!-- Card 2: GPU Detection -->
    <g transform="translate(360, 65)">
        <rect width="280" height="225" rx="12" fill="url(#cGrad2)" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">⚡</text>
        
        <text x="66" y="32" fill="#6ee7b7" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">2. ขุมพลัง GPU (NVIDIA)</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Hardware Acceleration</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ตรวจจับ <b>torch.cuda.is_available()</b></text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• การ์ดจอเร่งความเร็ว AI (NVIDIA T4)</text>
        <text x="28" y="132" fill="#34d399" font-size="11" font-weight="700" font-family="'Prompt', sans-serif">• เทรนโมเดลเร็วกว่า CPU สูงถึง 30 เท่า</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">CUDA Core VRAM: 15 GB Active</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="140" y="193" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">สถานะ: ✅ พร้อมฝึกสอนโมเดลความเร็วสูง</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 650 178 L 675 178" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrow2)"/>

    <!-- Card 3: GitHub Code & Dataset Sync -->
    <g transform="translate(685, 65)">
        <rect width="280" height="225" rx="12" fill="url(#cGrad3)" stroke="#06b6d4" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">🐙</text>
        
        <text x="66" y="32" fill="#67e8f9" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">3. ซิงก์คลังโค้ดวิจัย RBRU</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Git Sync &amp; Packages</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ดึงคลังโค้ดล่าสุด <b>smart-soil-ai</b></text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ติดตั้งโมดูล Agri-Vision 2.0 ROI</text>
        <text x="28" y="132" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• เตรียมชุดข้อมูลภาพจริง 2,583+ ไฟล์</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Git Commit: Auto Head Up-to-Date</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
        <text x="140" y="193" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">สถานะ: สภาพแวดล้อมพร้อม 100%</text>
    </g>
</svg>
