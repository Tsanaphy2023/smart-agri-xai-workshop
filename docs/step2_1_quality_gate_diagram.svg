<svg viewBox="0 0 1000 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="qgBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>

        <linearGradient id="qgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="qgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="qgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
        </linearGradient>

        <marker id="qgArr1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
        </marker>
        <marker id="qgArr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>
    </defs>

    <!-- Canvas Background -->
    <rect width="1000" height="320" rx="16" fill="url(#qgBg)" stroke="#1e293b" stroke-width="2"/>

    <!-- Header / Banner -->
    <g transform="translate(35, 24)">
        <rect x="0" y="0" width="130" height="22" rx="5" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
        <text x="65" y="15" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">STEP 2.1 GATE</text>
        <text x="145" y="16" fill="#f8fafc" font-size="16" font-weight="800" font-family="'Prompt', sans-serif">🔍 ขั้นตอนเสริม (2.1): ตรวจวัดคุณภาพความคมชัด แสงสะท้อนจ้า และการคัดกรองทางฟิสิกส์</text>
    </g>

    <!-- Card 1: Sample Inspection -->
    <g transform="translate(35, 65)">
        <rect width="280" height="225" rx="12" fill="url(#qgGrad1)" stroke="#06b6d4" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">🖼️</text>
        
        <text x="66" y="32" fill="#67e8f9" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">1. สุ่มตรวจภาพรายคลาส</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Visual Inspection</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• สุ่มดูภาพละเอียดทีละแปลง</text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ส่องดูเนื้อดินความชื้นต่างกัน</text>
        <text x="28" y="132" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ส่องดูอาการใบขาดธาตุ N-P-K</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Interactive Class Dropdown Preview</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
        <text x="140" y="193" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">เป้าหมาย: ตรวจสอบความถูกต้องของคลาส</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 325 178 L 350 178" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#qgArr1)"/>

    <!-- Card 2: Laplacian & Glare Analysis -->
    <g transform="translate(360, 65)">
        <rect width="280" height="225" rx="12" fill="url(#qgGrad2)" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">🔬</text>
        
        <text x="66" y="32" fill="#fde68a" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">2. คำนวณดัชนีทางฟิสิกส์</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Physical Metric Gates</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• <b>cv2.Laplacian:</b> ความคมชัด (&gt; 80)</text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• <b>Specular Glare:</b> แสงจ้าลวงตา (&lt; 4%)</text>
        <text x="28" y="132" fill="#fbbf24" font-size="11" font-weight="700" font-family="'Prompt', sans-serif">• <b>CIE L*a*b*:</b> ดัชนีสีชดเชยเงามืด</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Moisture Proxy: 100 - L* Metric</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="140" y="193" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">เกณฑ์: ตรวจสอบความสมบูรณ์เชิงแสง</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 650 178 L 675 178" stroke="#10b981" stroke-width="2.5" marker-end="url(#qgArr2)"/>

    <!-- Card 3: Quality Verdict -->
    <g transform="translate(685, 65)">
        <rect width="280" height="225" rx="12" fill="url(#qgGrad3)" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">🛡️</text>
        
        <text x="66" y="32" fill="#6ee7b7" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">3. คำตัดสินคุณภาพ (Verdict)</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Auto Quality Decision</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#34d399" font-size="11" font-weight="700" font-family="'Prompt', sans-serif">• ✅ คมชัด &amp; แสงสมดุล: ส่งต่อฝึกสอน AI</text>
        <text x="28" y="112" fill="#f87171" font-size="11" font-family="'Prompt', sans-serif">• ❌ ภาพเบลอ/ไหว: แจ้งเตือนคัดแยกออก</text>
        <text x="28" y="132" fill="#fbbf24" font-size="11" font-family="'Prompt', sans-serif">• ⚠️ แสงสะท้อนจ้า: ปรับด้วย CLAHE</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Automated Dataset Cleansing Rule</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="140" y="193" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">ผลลัพธ์: ชุดข้อมูลคุณภาพสูงระดับวิจัย</text>
    </g>
</svg>
