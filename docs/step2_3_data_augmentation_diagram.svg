<svg viewBox="0 0 1000 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="augBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>

        <linearGradient id="augGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="augGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="augGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="augGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
        </linearGradient>

        <marker id="augArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
        </marker>
        <marker id="augArr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
        </marker>
        <marker id="augArr3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="1000" height="320" rx="16" fill="url(#augBg)" stroke="#1e293b" stroke-width="2"/>

    <!-- Header Banner -->
    <g transform="translate(35, 24)">
        <rect x="0" y="0" width="130" height="22" rx="5" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1"/>
        <text x="65" y="15" fill="#c4b5fd" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">STEP 2.3 AUGMENT</text>
        <text x="145" y="16" fill="#f8fafc" font-size="16" font-weight="800" font-family="'Prompt', sans-serif">🎨 ขั้นตอนเสริม (2.3): Smart Data Augmentation Studio ขยายจำนวนภาพหลายเท่าตัว</text>
    </g>

    <!-- Card 1: Original Limited Data -->
    <g transform="translate(35, 65)">
        <rect width="210" height="225" rx="12" fill="url(#augGrad1)" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="32" cy="34" r="16" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="32" y="40" font-size="16" text-anchor="middle">📸</text>
        <text x="58" y="32" fill="#93c5fd" font-size="12" font-weight="800" font-family="'Prompt', sans-serif">1. ภาพต้นฉบับจำกัด</text>
        <text x="58" y="48" fill="#64748b" font-size="9" font-family="'JetBrains Mono', monospace">Limited Raw Dataset</text>

        <rect x="16" y="65" width="178" height="58" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
        <text x="26" y="83" fill="#cbd5e1" font-size="10" font-family="'Prompt', sans-serif">• ภาพถ่ายจากแปลง: 20-50 ภาพ</text>
        <text x="26" y="100" fill="#cbd5e1" font-size="10" font-family="'Prompt', sans-serif">• มุมกล้องเดียว แสงคงที่</text>
        <text x="26" y="115" fill="#ef4444" font-size="9.5" font-weight="700" font-family="'Prompt', sans-serif">⚠️ เสี่ยงต่อการเกิด Overfitting</text>

        <rect x="16" y="132" width="178" height="85" rx="6" fill="#1e293b" fill-opacity="0.5"/>
        <text x="26" y="152" fill="#93c5fd" font-size="10" font-weight="700" font-family="'Prompt', sans-serif">เป้าหมายกระบวนการ:</text>
        <text x="26" y="170" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">ขยายจำนวนภาพ 3x - 5x เท่า</text>
        <text x="26" y="188" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">จำลองความแปรปรวนธรรมชาติ</text>
        <text x="26" y="206" fill="#38bdf8" font-size="9.5" font-weight="700" font-family="'Prompt', sans-serif">→ สร้างความแกร่งให้โมเดล</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 252 178 L 275 178" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#augArr)"/>

    <!-- Card 2: Geometric Transforms -->
    <g transform="translate(280, 65)">
        <rect width="210" height="225" rx="12" fill="url(#augGrad2)" stroke="#8b5cf6" stroke-width="1.5"/>
        <circle cx="32" cy="34" r="16" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="32" y="40" font-size="16" text-anchor="middle">🔄</text>
        <text x="58" y="32" fill="#c4b5fd" font-size="12" font-weight="800" font-family="'Prompt', sans-serif">2. หมุน พลิก และซูม</text>
        <text x="58" y="48" fill="#64748b" font-size="9" font-family="'JetBrains Mono', monospace">Geometric Augment</text>

        <rect x="16" y="65" width="178" height="72" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
        <text x="26" y="83" fill="#e2e8f0" font-size="10" font-weight="700" font-family="'Prompt', sans-serif">🌀 Rotation & Flipping:</text>
        <text x="26" y="100" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• หมุนมุม ±15°, 90°, 180°, 270°</text>
        <text x="26" y="117" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• พลิกแนวนอน (H) & แนวตั้ง (V)</text>
        <text x="26" y="132" fill="#a78bfa" font-size="9" font-family="'JetBrains Mono', monospace">cv2.warpAffine & cv2.flip</text>

        <rect x="16" y="145" width="178" height="72" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
        <text x="26" y="163" fill="#e2e8f0" font-size="10" font-weight="700" font-family="'Prompt', sans-serif">🔍 Scale Zoom & Crop:</text>
        <text x="26" y="180" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• ซูมเฉพาะเนื้อผิว 1.1x - 1.25x</text>
        <text x="26" y="197" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• จำลองการถ่ายภาพระยะใกล้/ไกล</text>
        <text x="26" y="211" fill="#a78bfa" font-size="9" font-family="'JetBrains Mono', monospace">RandomResizedCrop</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 497 178 L 520 178" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#augArr2)"/>

    <!-- Card 3: Photometric & Environmental -->
    <g transform="translate(525, 65)">
        <rect width="210" height="225" rx="12" fill="url(#augGrad3)" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="32" cy="34" r="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="32" y="40" font-size="16" text-anchor="middle">☀️</text>
        <text x="58" y="32" fill="#fcd34d" font-size="12" font-weight="800" font-family="'Prompt', sans-serif">3. จำลองแสงแดด/เงา</text>
        <text x="58" y="48" fill="#64748b" font-size="9" font-family="'JetBrains Mono', monospace">Photometric & Spectral</text>

        <rect x="16" y="65" width="178" height="72" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
        <text x="26" y="83" fill="#e2e8f0" font-size="10" font-weight="700" font-family="'Prompt', sans-serif">💡 Sunlight & Shadows:</text>
        <text x="26" y="100" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• ปรับแสงสว่าง & เงา (±20%)</text>
        <text x="26" y="117" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• Color Jitter (Hue, Sat, Val)</text>
        <text x="26" y="132" fill="#f59e0b" font-size="9" font-family="'JetBrains Mono', monospace">convertScaleAbs (α, β)</text>

        <rect x="16" y="145" width="178" height="72" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
        <text x="26" y="163" fill="#e2e8f0" font-size="10" font-weight="700" font-family="'Prompt', sans-serif">🔬 Texture CLAHE & Grain:</text>
        <text x="26" y="180" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• ดึงลวดลายเส้นใบไม้/เม็ดดิน</text>
        <text x="26" y="197" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• จำลองสัญญาณรบกวนเซนเซอร์</text>
        <text x="26" y="211" fill="#f59e0b" font-size="9" font-family="'JetBrains Mono', monospace">CLAHE Lab + Gaussian Noise</text>
    </g>

    <!-- Connector 3 -->
    <path d="M 742 178 L 765 178" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#augArr3)"/>

    <!-- Card 4: Augmented Big Dataset -->
    <g transform="translate(770, 65)">
        <rect width="195" height="225" rx="12" fill="url(#augGrad4)" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="32" cy="34" r="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
        <text x="32" y="40" font-size="16" text-anchor="middle">🚀</text>
        <text x="58" y="32" fill="#6ee7b7" font-size="12" font-weight="800" font-family="'Prompt', sans-serif">4. คลังภาพพร้อมฝึก</text>
        <text x="58" y="48" fill="#64748b" font-size="9" font-family="'JetBrains Mono', monospace">Expanded Dataset</text>

        <rect x="14" y="65" width="167" height="68" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
        <text x="22" y="83" fill="#34d399" font-size="10" font-weight="700" font-family="'Prompt', sans-serif">📈 ผลลัพธ์ข้อมูลสังเคราะห์:</text>
        <text x="22" y="100" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• ปริมาณภาพ: 200 - 500+ ภาพ</text>
        <text x="22" y="117" fill="#cbd5e1" font-size="9.5" font-family="'Prompt', sans-serif">• ขยายเพิ่มขึ้น 300% - 500%</text>
        <text x="22" y="129" fill="#10b981" font-size="8.5" font-weight="700" font-family="'JetBrains Mono', monospace">dataset/train/ ready</text>

        <rect x="14" y="141" width="167" height="76" rx="6" fill="#1e293b" fill-opacity="0.5"/>
        <text x="22" y="160" fill="#6ee7b7" font-size="9.5" font-weight="700" font-family="'Prompt', sans-serif">ความพร้อมสู่ Step 3:</text>
        <text x="22" y="177" fill="#cbd5e1" font-size="9" font-family="'Prompt', sans-serif">✓ ความทนทานต่อแสงเงา</text>
        <text x="22" y="193" fill="#cbd5e1" font-size="9" font-family="'Prompt', sans-serif">✓ รองรับการหมุนทุกมุมมอง</text>
        <text x="22" y="209" fill="#38bdf8" font-size="9" font-weight="700" font-family="'Prompt', sans-serif">✓ แม่นยำสูงเมื่อขึ้น Edge AI</text>
    </g>
</svg>
