<svg viewBox="0 0 1000 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="s2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>

        <linearGradient id="s2Grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="s2Grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="s2Grad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
        </linearGradient>

        <marker id="s2Arr1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>
        <marker id="s2Arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
        </marker>
    </defs>

    <!-- Canvas Background -->
    <rect width="1000" height="320" rx="16" fill="url(#s2Bg)" stroke="#1e293b" stroke-width="2"/>

    <!-- Header / Banner -->
    <g transform="translate(35, 24)">
        <rect x="0" y="0" width="130" height="22" rx="5" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
        <text x="65" y="15" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">STEP 2 PIPELINE</text>
        <text x="145" y="16" fill="#f8fafc" font-size="16" font-weight="800" font-family="'Prompt', sans-serif">📂 ขั้นตอนที่ 2: เลือกชุดข้อมูลวิจัย สกัดกรอบเป้าหมาย ROI และแสดงตัวอย่างภาพ</text>
    </g>

    <!-- Card 1: Dataset Selection -->
    <g transform="translate(35, 65)">
        <rect width="280" height="225" rx="12" fill="url(#s2Grad1)" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">📂</text>
        
        <text x="66" y="32" fill="#93c5fd" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">1. เลือกชุดข้อมูลวิจัย</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Dataset Selection</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ดิน 5 ชนิด (ดำ, ลูกรัง, เถ้า, พีต, เหลือง)</text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• โรคทุเรียนจันทบุรี 5 อาการ</text>
        <text x="28" y="132" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• หรืออัปโหลดไฟล์ <b>.zip</b> ของตนเอง</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Auto-unzip &amp; Class Label Mapping</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="140" y="193" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">คลังภาพ: 2,583+ ภาพมาตรฐาน</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 325 178 L 350 178" stroke="#10b981" stroke-width="2.5" marker-end="url(#s2Arr1)"/>

    <!-- Card 2: Precision ROI Gate -->
    <g transform="translate(360, 65)">
        <rect width="280" height="225" rx="12" fill="url(#s2Grad2)" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">🌿</text>
        
        <text x="66" y="32" fill="#6ee7b7" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">2. ระบบกรอง ROI อัจฉริยะ</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Agri-Vision 2.0 Gate</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• สกัดดัชนีแสงชีวภาพ ExG / Lab</text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• 2D Gaussian Prior ล็อกจุดกึ่งกลาง</text>
        <text x="28" y="132" fill="#34d399" font-size="11" font-weight="700" font-family="'Prompt', sans-serif">• ตัดพื้นหลัง/มือ/รองเท้า ออก 100%</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Solidity &gt;= 0.70 &amp; Convexity Filter</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="140" y="193" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">คุณภาพ: ป้องกัน Clever Hans Effect</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 650 178 L 675 178" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#s2Arr2)"/>

    <!-- Card 3: Preview & Bounding Box -->
    <g transform="translate(685, 65)">
        <rect width="280" height="225" rx="12" fill="url(#s2Grad3)" stroke="#8b5cf6" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">🎯</text>
        
        <text x="66" y="32" fill="#c4b5fd" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">3. ตีกรอบพิกัดเป้าหมาย</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Visual Preview Grid</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• แสดงตารางภาพตัวอย่างทุกคลาส</text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ตีกรอบสี่เหลี่ยมสีเขียวล้อมรอบเป้าหมาย</text>
        <text x="28" y="132" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• คำนวณสัดส่วนพื้นที่ (Area Ratio %)</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">BBox [x1, y1, x2, y2] Annotation</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
        <text x="140" y="193" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">ผลลัพธ์: พร้อมส่งเข้าสเต็ปฝึกสอน AI</text>
    </g>
</svg>
