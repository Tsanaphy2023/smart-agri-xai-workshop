<svg viewBox="0 0 1000 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="s4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>

        <linearGradient id="s4Grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="s4Grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="s4Grad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
        </linearGradient>

        <marker id="s4Arr1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
        </marker>
        <marker id="s4Arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>
    </defs>

    <!-- Canvas Background -->
    <rect width="1000" height="320" rx="16" fill="url(#s4Bg)" stroke="#1e293b" stroke-width="2"/>

    <!-- Header / Banner -->
    <g transform="translate(35, 24)">
        <rect x="0" y="0" width="130" height="22" rx="5" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
        <text x="65" y="15" fill="#c4b5fd" font-size="10" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">STEP 4 PIPELINE</text>
        <text x="145" y="16" fill="#f8fafc" font-size="16" font-weight="800" font-family="'Prompt', sans-serif">⚡ ขั้นตอนที่ 4: บีบอัดโมเดล ส่งออกเป็นมาตรฐานสากล (ONNX/TFLite) และติดตั้งใช้งานจริง</text>
    </g>

    <!-- Card 1: Trained Model -->
    <g transform="translate(35, 65)">
        <rect width="280" height="225" rx="12" fill="url(#s4Grad1)" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">🧠</text>
        
        <text x="66" y="32" fill="#fde68a" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">1. โมเดลบนคลาวด์</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Trained Neural Net</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ผ่านการเทรนบน GPU เรียบร้อย</text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ฟอร์แมต PyTorch / Keras H5</text>
        <text x="28" y="132" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ขนาดไฟล์เดิมค่อนข้างใหญ่ (~14-40 MB)</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Float32 Dense Weights</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="140" y="193" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">ขนาดเดิม: ~14 MB (H5)</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 325 178 L 350 178" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#s4Arr1)"/>

    <!-- Card 2: Compression & Quantization -->
    <g transform="translate(360, 65)">
        <rect width="280" height="225" rx="12" fill="url(#s4Grad2)" stroke="#8b5cf6" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">📦</text>
        
        <text x="66" y="32" fill="#c4b5fd" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">2. บีบอัด Quantization</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Graph Compression</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• แปลงเป็น <b>ONNX Runtime / TFLite</b></text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• ลดความแม่นยำเหลือ FP16 / INT8</text>
        <text x="28" y="132" fill="#a78bfa" font-size="11" font-weight="700" font-family="'Prompt', sans-serif">• ลดขนาดไฟล์ลง 70-80% เหลือ ~2.5 MB</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">TFLite FlatBuffer &amp; ONNX IR v8</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
        <text x="140" y="193" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">บีบอัดสำเร็จ: 2.5 MB (ลดลง 82%)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 650 178 L 675 178" stroke="#10b981" stroke-width="2.5" marker-end="url(#s4Arr2)"/>

    <!-- Card 3: Offline Edge Deployment -->
    <g transform="translate(685, 65)">
        <rect width="280" height="225" rx="12" fill="url(#s4Grad3)" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="36" cy="36" r="18" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
        <text x="36" y="42" font-size="18" text-anchor="middle">📱</text>
        
        <text x="66" y="32" fill="#6ee7b7" font-size="14" font-weight="700" font-family="'Prompt', sans-serif">3. ติดตั้งลงอุปกรณ์ภาคสนาม</text>
        <text x="66" y="48" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">Offline Edge AI</text>

        <rect x="18" y="72" width="244" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="28" y="92" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• แอปมือถือ Flutter (Android / iOS)</text>
        <text x="28" y="112" fill="#cbd5e1" font-size="11" font-family="'Prompt', sans-serif">• เว็บ Streamlit Dashboard (In-Process)</text>
        <text x="28" y="132" fill="#34d399" font-size="11" font-weight="700" font-family="'Prompt', sans-serif">• ทำงานออฟไลน์ 100% ไร้สัญญาณเน็ต</text>
        <text x="28" y="148" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Inference Latency: &lt; 15 ms</text>

        <rect x="18" y="172" width="244" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="140" y="193" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" font-family="'Prompt', sans-serif">การนำไปใช้: ใช้งานจริงในแปลงเกษตร</text>
    </g>
</svg>
